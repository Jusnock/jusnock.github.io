site_name: "Juan Francisco Vazquez | Docs & Labs"
site_description: "Documentación técnica, casos de estudio en redes, infraestructura SysAdmin y laboratorios de Ciberseguridad."
site_author: "Juan Francisco Vazquez"
site_url: "https://jusnock.github.io/"

repo_name: "Jusnock/jusnock.github.io"
repo_url: "https://github.com/Jusnock"

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo claro
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo oscuro
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - def_list
  - toc:
      permalink: true

nav:
  - "Inicio": "index.md"
  - "Perfil & CV": "sobre-mi.md"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jusnock
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/juan-francisco-vazquez-0aaa94218
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:vazquezjuanfrancisco49@gmail.com
      name: Email
